<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journal | Audio Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/app.css">
<script src="js/theme.js"></script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="brand" href="index.html"><i></i>Audio Journal</a>
    <button class="chip" id="theme" type="button">Dark mode</button>
  </div>

  <h1>Talk messy, read clean.</h1>
  <p class="sub">Tap record, ramble, tap again.</p>

  <section class="rec-zone">
    <button id="rec" type="button" aria-pressed="false" aria-label="Start recording">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4Zm6-4a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.93V22h2v-3.07A8 8 0 0 0 20 11h-2Z"/></svg>
      <span class="sq"></span>
    </button>
    <div class="meter" id="meter" aria-hidden="true"><b></b><b></b><b></b><b></b><b></b><b></b><b></b></div>
    <div id="timer" aria-hidden="true"></div>
    <div id="status" role="status" aria-live="polite">Ready when you are.</div>
    <div id="live" aria-label="Live transcript"></div>
  </section>

  <div id="entry" hidden>
    <div class="bar">
      <div class="seg" role="group" aria-label="Text version">
        <button id="tClean" type="button" aria-pressed="true">Clean</button>
        <button id="tRaw" type="button" aria-pressed="false">Raw</button>
      </div>
      <div class="acts">
        <button id="copy" type="button">Copy</button>
        <button id="del" class="del" type="button">Delete</button>
      </div>
    </div>
    <article class="card">
      <header><p class="date" id="cDate"></p><p class="time" id="cTime"></p></header>
      <div class="body" id="cBody"></div>
      <footer id="cCount"></footer>
    </article>
  </div>
  <p class="empty" id="empty">No entries yet. Your first one will show up here.</p>

  <h2 class="hist-h" id="histH" hidden>Past entries</h2>
  <ul class="hist" id="hist"></ul>
</div>
<div id="toast" role="status"></div>

<script src="js/app.js"></script>
</body>
</html>
